<!-- ============================================================
     MASTER KM (MKM) — body content
     Owner: KM team.  Edit ONLY this file for Master KM content.
     Loaded by app.js when the "Master KM (MKM)" pill is clicked.

     Uses the app's native styles (pc-card, km-section, km-card,
     kb-row, st-chip …) so it matches the rest of the tracker.
     This is a static starter — numbers/statuses are placeholders
     you can edit freely. Live data wiring can be added later.
============================================================ -->
<div class="pc-main" id="mkmRoot">

  <!-- ---------- Page heading ---------- -->
  <div class="pc-head-card" style="display:flex;align-items:center;justify-content:space-between;gap:16px">
    <div>
      <h3 style="margin:0">Master KM (MKM)</h3>
      <div class="pc-hint" style="margin-top:4px">Master reference of all KM authorities across business units.</div>
    </div>
    <span class="st-chip st-in-progress">In Progress</span>
  </div>

  <!-- ---------- KM milestone flow (ALWAYS on top; acts as the step switcher) ---------- -->
  <section class="pc-card">
    <h4 class="pc-card-title">KM Milestone Flow</h4>
    <div class="pc-hint" style="margin-top:0;margin-bottom:10px">Click a milestone to open it below. Click another to switch steps.</div>
    <div style="overflow-x:auto" data-mkm-lane><!-- SVG flowchart injected here --></div>
    <div data-mkm-legend style="margin-top:8px"><!-- legend injected here --></div>
  </section>

  <!-- ===== STEP HOST — the open milestone's working page appears right here ===== -->
  <div id="mkmStepHost" hidden>
    <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
      <button type="button" data-mkm-back title="Close step" aria-label="Close step"
        style="border:none;background:none;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:2px 8px">✕</button>
    </div>
    <!-- Step 1 renders natively here; Steps 2–7 get the shared #stepDetail block moved in -->
    <div id="mkmStepContent"></div>
  </div>

  <!-- ===== OVERVIEW (hidden while a milestone step is open) =====
       Intentionally empty. The KM Status Overview, Internal/External
       Authorities lists, Master KM Checklist and Reference sections were
       removed per request — the MKM landing view is now just the heading
       and the KM Milestone Flow above. The wrapper is kept because app.js
       toggles its visibility when a milestone step opens/closes. -->
  <div id="mkmOverview"></div>

</div>
