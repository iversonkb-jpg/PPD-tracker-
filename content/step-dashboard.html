<!-- Project dashboard — branched milestone flowchart. Nodes/matrix/legend rendered by app.js. -->
<div class="dash-head">
  <h3 data-dash-title>Dashboard</h3>
  <span class="dash-hint">Click a step to open its working page. Click 6-KM / 6-BP to expand the clearance matrix.</span>
</div>

<div class="dash-scroll">
  <div class="dash-cv">
    <div class="dash-box-above" data-dash-km><!-- KM dept matrix (above flow) rendered by app.js --></div>
    <div class="dash-lane" data-dash-lane><!-- flowchart nodes rendered by app.js --></div>
    <div class="dash-box-below" data-dash-bp><!-- BP dept matrix (below flow) rendered by app.js --></div>
  </div>
</div>

<div data-dash-legend><!-- legend rendered by app.js --></div>
